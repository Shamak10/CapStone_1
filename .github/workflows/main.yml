name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate release workflow policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release.yml
          grep -Fq 'image_name="${GITHUB_REPOSITORY,,}"' .github/workflows/release.yml
          grep -Fq 'uses: docker/setup-qemu-action@v4' .github/workflows/release.yml
          grep -Fq 'platforms: linux/amd64,linux/arm64' .github/workflows/release.yml
          if grep -Fqi '/enterprisedevgroupproject' .github/workflows/release.yml; then
            echo "Release workflow must publish to the current repository package name." >&2
            exit 1
          fi
          if grep -Fqi 'CREDENTIALS.txt' .github/workflows/release.yml; then
            echo "Release workflow must not publish generated credentials." >&2
            exit 1
          fi

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always() && hashFiles('target/site/jacoco/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_bWlnaHR5LWVzY2FyZ290LTY1NjIuY2xlcmsuYWNjb3VudHMuZGV2JA
        run: npm run build

  container-build:
    name: Validate container build
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: capstone-1:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
