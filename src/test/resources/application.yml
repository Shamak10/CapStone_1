# Tests run on in-memory H2, not the Postgres the application uses at runtime.
# This is a known gap, not the intended end state: S0-2 replaces it with
# Testcontainers so tests exercise the same Postgres 16 and the same Flyway
# migrations as production. Until then the H2 schema below is test-only —
# nothing in src/main reads it.
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
      data-locations: classpath:h2-data.sql
  # Flyway's migrations are Postgres-flavoured; H2 gets its schema from the
  # scripts above and Hibernate creates the entity tables.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
