# Test-only overrides. This is application.properties, not application.yml, on
# purpose: a test application.yml would shadow src/main's file outright and take
# the Clerk resource-server configuration down with it. A .properties file in the
# test classpath is merged over the main .yml instead, so only the keys below change.
#
# Tests run on in-memory H2 rather than the Postgres the application uses. That is a
# known gap, not the end state: S0-2 replaces this with Testcontainers so tests
# exercise the same Postgres 16 and the same Flyway migrations as production.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# The migrations are Postgres-flavoured; under H2 the schema comes from the scripts
# below and Hibernate creates the entity tables.
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2-schema.sql
spring.sql.init.data-locations=classpath:h2-data.sql
spring.jpa.hibernate.ddl-auto=create-drop
