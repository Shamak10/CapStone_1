<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – CampusBridge</title>
    <meta name="description" content="Chat with buyers, sellers, and students at Cincinnati-area schools." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/clerk-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/ui@1.33.0/dist/ui.browser.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@6.32.0/dist/clerk.browser.js" crossorigin="anonymous"></script>
</head>

<body class="search-page">

<nav class="nav nav-search">
    <div class="nav-brand">
        <div class="nav-logo">🎓</div>
        <span class="nav-title">CAMPUSBRIDGE</span>
    </div>
    <div class="nav-links">
        <a href="/search.html" class="nav-link">Directory</a>
        <a href="/marketplace.html" class="nav-link">Marketplace</a>
        <a href="/community.html" class="nav-link">Community</a>
        <a href="/support.html" class="nav-link">Support</a>
        <a href="/messages.html" class="nav-link nav-link-active">Messages</a>
        <span class="nav-auth" data-clerk-auth></span>
    </div>
</nav>

<div class="chat-layout">
    <aside class="chat-sidebar" id="chat-sidebar">
        <div id="conversation-list">
            <div class="empty-state"><p class="empty-text">Loading conversations…</p></div>
        </div>
        <div style="padding: 14px 18px; border-top: 1px solid var(--color-border);">
            <button class="btn-ghost-sm" style="width:100%;" onclick="startDirectChat()">+ New Direct Message</button>
        </div>
    </aside>

    <main class="chat-main" id="chat-main">
        <div class="empty-state" style="margin: auto;">
            <div class="empty-icon">💬</div>
            <h2 class="empty-title">Select a conversation</h2>
            <p class="empty-text">Or start one from a marketplace listing.</p>
        </div>
    </main>
</div>

<script>
    let conversations = [];
    let activeConversationId = null;
    let myEmail = null;
    let pollTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const user = await ClerkAuth.requireSignedIn();
        if (user) {
            myEmail = user.primaryEmailAddress ? user.primaryEmailAddress.emailAddress : null;
        }
        loadConversations();
        pollTimer = setInterval(loadConversations, 8000);
    });

    async function loadConversations() {
        try {
            const res = await ClerkAuth.fetch('/api/messages/conversations');
            if (!res.ok) return;
            conversations = await res.json();
            renderConversationList();
        } catch (e) { /* ignore transient failures */ }
    }

    function renderConversationList() {
        const list = document.getElementById('conversation-list');
        if (!conversations.length) {
            list.innerHTML = '<div class="empty-state"><p class="empty-text">No conversations yet. Message a seller from the Marketplace to get started.</p></div>';
            return;
        }
        list.innerHTML = conversations.map(c => {
            const other = otherParticipant(c);
            const active = c.id === activeConversationId ? 'active' : '';
            return `
                <div class="chat-list-item ${active}" onclick="openConversation(${c.id})">
                    <div class="chat-list-item-top">
                        <span>${escapeHtml(other)}</span>
                        ${c.unreadCount > 0 ? `<span class="chat-unread-dot">${c.unreadCount}</span>` : ''}
                    </div>
                    <div class="app-card-meta">${c.type === 'MARKETPLACE' ? 'Marketplace chat' : 'Direct message'}</div>
                </div>
            `;
        }).join('');
    }

    function otherParticipant(conversation) {
        const others = (conversation.participantEmails || []).filter(e => e.toLowerCase() !== (myEmail || '').toLowerCase());
        return others.length ? others[0] : 'Conversation';
    }

    async function openConversation(id) {
        activeConversationId = id;
        renderConversationList();
        await ClerkAuth.fetch(`/api/messages/conversations/${id}/read`, { method: 'POST' });

        const conversation = conversations.find(c => c.id === id);
        const other = conversation ? otherParticipant(conversation) : '';

        document.getElementById('chat-main').innerHTML = `
            <div style="padding: 16px 20px; border-bottom: 1px solid var(--color-border); display:flex; justify-content: space-between; align-items:center;">
                <strong>${escapeHtml(other)}</strong>
                <div>
                    <button class="btn-ghost-sm" onclick="blockUser('${escapeAttr(other)}')">Block</button>
                    <button class="btn-ghost-sm" onclick="reportUser('${escapeAttr(other)}')">Report</button>
                </div>
            </div>
            <div class="chat-thread" id="chat-thread"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" class="filter-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMessage()" />
                <button class="btn-primary-sm" onclick="sendMessage()">Send</button>
            </div>
        `;
        loadMessages(id);
    }

    async function loadMessages(conversationId) {
        try {
            const res = await ClerkAuth.fetch(`/api/messages/conversations/${conversationId}/messages`);
            if (!res.ok) return;
            const messages = await res.json();
            const thread = document.getElementById('chat-thread');
            if (!thread) return;
            thread.innerHTML = messages.map(m => {
                const mine = myEmail && m.senderEmail.toLowerCase() === myEmail.toLowerCase();
                return `<div class="chat-bubble ${mine ? 'chat-bubble-mine' : 'chat-bubble-theirs'}">${escapeHtml(m.content)}</div>`;
            }).join('');
            thread.scrollTop = thread.scrollHeight;
        } catch (e) { /* ignore */ }
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const content = input.value.trim();
        if (!content || !activeConversationId) return;
        input.value = '';
        try {
            const res = await ClerkAuth.fetch(`/api/messages/conversations/${activeConversationId}/messages`, {
                method: 'POST',
                body: JSON.stringify({ content: content })
            });
            if (res.ok) {
                loadMessages(activeConversationId);
            } else {
                const err = await res.json().catch(() => null);
                alert(err && err.message ? err.message : 'Could not send message');
            }
        } catch (e) {
            alert('Could not connect to the server');
        }
    }

    async function startDirectChat() {
        const email = prompt('Enter the student\'s email to message:');
        if (!email) return;
        try {
            const res = await ClerkAuth.fetch('/api/messages/conversations', {
                method: 'POST',
                body: JSON.stringify({ recipientEmail: email })
            });
            if (res.ok) {
                const conversation = await res.json();
                await loadConversations();
                openConversation(conversation.id);
            } else {
                const err = await res.json().catch(() => null);
                alert(err && err.message ? err.message : 'Could not start conversation');
            }
        } catch (e) {
            alert('Could not connect to the server');
        }
    }

    async function blockUser(email) {
        if (!confirm(`Block ${email}? They won't be able to message you.`)) return;
        await ClerkAuth.fetch('/api/users/block', { method: 'POST', body: JSON.stringify({ email: email }) });
        alert('Blocked.');
    }

    async function reportUser(email) {
        const reason = prompt(`Why are you reporting ${email}?`);
        if (!reason) return;
        await ClerkAuth.fetch('/api/users/report', { method: 'POST', body: JSON.stringify({ email: email, reason: reason }) });
        alert('Thanks — this user has been reported to moderators.');
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function escapeAttr(text) {
        return (text || '').replace(/'/g, "\\'");
    }
</script>
</body>
</html>
