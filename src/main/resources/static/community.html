<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community – CampusBridge</title>
    <meta name="description" content="Groups, study groups, posts, and events across Cincinnati-area schools." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/clerk-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/ui@1.33.0/dist/ui.browser.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@6.32.0/dist/clerk.browser.js" crossorigin="anonymous"></script>
</head>

<body class="search-page">

<nav class="nav nav-search">
    <div class="nav-brand">
        <div class="nav-logo">🎓</div>
        <span class="nav-title">CAMPUSBRIDGE</span>
    </div>
    <div class="nav-links">
        <a href="/search.html" class="nav-link">Directory</a>
        <a href="/marketplace.html" class="nav-link">Marketplace</a>
        <a href="/community.html" class="nav-link nav-link-active">Community</a>
        <a href="/support.html" class="nav-link">Support</a>
        <a href="/messages.html" class="nav-link">Messages</a>
        <span class="nav-auth" data-clerk-auth></span>
    </div>
</nav>

<main class="search-main" style="max-width: 900px; margin: 0 auto; padding: 32px 24px;">
    <h1 class="section-heading">Community</h1>
    <p class="section-subheading">Directory, groups, posts, and events across every Cincinnati-area school.</p>

    <div class="tab-switcher">
        <button class="tab-btn tab-btn-active" id="tab-feed" onclick="switchSection('feed')">Feed</button>
        <button class="tab-btn" id="tab-groups" onclick="switchSection('groups')">Groups</button>
        <button class="tab-btn" id="tab-events" onclick="switchSection('events')">Events</button>
    </div>

    <!-- Feed -->
    <section id="section-feed">
        <div class="app-card" style="margin-bottom: 20px;">
            <textarea id="post-content" class="form-textarea" placeholder="Share something with the community…"></textarea>
            <div class="app-card-actions">
                <button class="btn-primary-sm" onclick="createPost()">Post</button>
            </div>
        </div>
        <div id="feed-list"><p class="empty-text">Loading feed…</p></div>
    </section>

    <!-- Groups -->
    <section id="section-groups" style="display:none;">
        <div class="app-card" style="margin-bottom: 20px;">
            <h3 class="app-card-title" style="margin-bottom: 14px;">Create a Group</h3>
            <div class="form-row">
                <input type="text" id="grp-name" class="filter-input" placeholder="Group name" />
                <select id="grp-type" class="filter-select">
                    <option value="MAJOR">Major</option>
                    <option value="GRADUATION_YEAR">Graduation Year</option>
                    <option value="COURSE_STUDY">Course Study Group</option>
                    <option value="GENERAL">General</option>
                </select>
                <input type="text" id="grp-relatedValue" class="filter-input" placeholder="e.g. Computer Science, 2027, CS 2021" />
            </div>
            <textarea id="grp-description" class="form-textarea" placeholder="What's this group about?"></textarea>
            <div class="app-card-actions">
                <button class="btn-primary-sm" onclick="createGroup()">Create Group</button>
            </div>
        </div>
        <div id="groups-list"><p class="empty-text">Loading groups…</p></div>
    </section>

    <!-- Events -->
    <section id="section-events" style="display:none;">
        <div class="app-card" style="margin-bottom: 20px;">
            <h3 class="app-card-title" style="margin-bottom: 14px;">Post an Event</h3>
            <div class="form-row">
                <input type="text" id="evt-title" class="filter-input" placeholder="Event title" />
                <input type="datetime-local" id="evt-startsAt" class="filter-input" />
                <input type="text" id="evt-location" class="filter-input" placeholder="Location" />
            </div>
            <textarea id="evt-description" class="form-textarea" placeholder="Event details"></textarea>
            <div class="app-card-actions">
                <button class="btn-primary-sm" onclick="createEvent()">Post Event</button>
            </div>
        </div>
        <div id="events-list"><p class="empty-text">Loading events…</p></div>
    </section>
</main>

<script>
    window.addEventListener('DOMContentLoaded', async () => {
        await ClerkAuth.requireSignedIn();
        loadFeed();
    });

    function switchSection(name) {
        ['feed', 'groups', 'events'].forEach(s => {
            document.getElementById('section-' + s).style.display = (s === name) ? 'block' : 'none';
            document.getElementById('tab-' + s).classList.toggle('tab-btn-active', s === name);
        });
        if (name === 'groups') loadGroups();
        if (name === 'events') loadEvents();
    }

    // ---- Feed ----
    async function loadFeed() {
        const list = document.getElementById('feed-list');
        try {
            const res = await ClerkAuth.fetch('/api/community/posts');
            const posts = res.ok ? await res.json() : [];
            if (!posts.length) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><h2 class="empty-title">No posts yet</h2><p class="empty-text">Be the first to share something.</p></div>';
                return;
            }
            list.innerHTML = posts.map(buildPostCard).join('');
        } catch (e) {
            list.innerHTML = '<p class="empty-text">Could not load the feed.</p>';
        }
    }

    function buildPostCard(p) {
        return `
            <div class="app-card" style="margin-bottom: 16px;">
                <div class="app-card-meta">${escapeHtml(p.authorEmail)} · ${new Date(p.createdAt).toLocaleString()}${p.pinned ? ' · 📌 Pinned' : ''}</div>
                <p class="app-card-body">${escapeHtml(p.content)}</p>
                <div class="app-card-actions">
                    <button class="btn-ghost-sm" onclick="toggleLike(${p.id}, ${p.likedByMe})">${p.likedByMe ? '❤️' : '🤍'} ${p.likeCount}</button>
                    <span class="btn-ghost-sm" style="cursor:default;">💬 ${p.commentCount} comments</span>
                    <button class="btn-danger-sm" onclick="deletePost(${p.id})">Delete</button>
                </div>
            </div>
        `;
    }

    async function createPost() {
        const content = document.getElementById('post-content').value.trim();
        if (!content) return;
        const res = await ClerkAuth.fetch('/api/community/posts', { method: 'POST', body: JSON.stringify({ content: content }) });
        if (res.ok) {
            document.getElementById('post-content').value = '';
            loadFeed();
        }
    }

    async function toggleLike(id, likedByMe) {
        const method = likedByMe ? 'DELETE' : 'POST';
        await ClerkAuth.fetch(`/api/community/posts/${id}/like`, { method: method });
        loadFeed();
    }

    async function deletePost(id) {
        if (!confirm('Delete this post?')) return;
        await ClerkAuth.fetch(`/api/community/posts/${id}`, { method: 'DELETE' });
        loadFeed();
    }

    // ---- Groups ----
    async function loadGroups() {
        const list = document.getElementById('groups-list');
        try {
            const res = await ClerkAuth.fetch('/api/community/groups');
            const groups = res.ok ? await res.json() : [];
            if (!groups.length) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><h2 class="empty-title">No groups yet</h2></div>';
                return;
            }
            list.innerHTML = '<div class="app-grid">' + groups.map(buildGroupCard).join('') + '</div>';
        } catch (e) {
            list.innerHTML = '<p class="empty-text">Could not load groups.</p>';
        }
    }

    function buildGroupCard(g) {
        return `
            <div class="app-card">
                <div class="app-card-header">
                    <div class="app-card-title">${escapeHtml(g.name)}</div>
                    <span class="badge">${escapeHtml(g.type)}</span>
                </div>
                <div class="app-card-meta">${g.relatedValue ? escapeHtml(g.relatedValue) + ' · ' : ''}${g.memberCount} members</div>
                <p class="app-card-body">${escapeHtml(g.description || '')}</p>
                <div class="app-card-actions">
                    ${g.joined
                        ? `<button class="btn-ghost-sm" onclick="leaveGroup(${g.id})">Leave</button>`
                        : `<button class="btn-primary-sm" onclick="joinGroup(${g.id})">Join</button>`}
                </div>
            </div>
        `;
    }

    async function createGroup() {
        const name = document.getElementById('grp-name').value.trim();
        if (!name) { alert('Group name is required'); return; }
        const body = {
            name: name,
            type: document.getElementById('grp-type').value,
            relatedValue: document.getElementById('grp-relatedValue').value.trim() || null,
            description: document.getElementById('grp-description').value.trim()
        };
        const res = await ClerkAuth.fetch('/api/community/groups', { method: 'POST', body: JSON.stringify(body) });
        if (res.ok) {
            document.getElementById('grp-name').value = '';
            document.getElementById('grp-relatedValue').value = '';
            document.getElementById('grp-description').value = '';
            loadGroups();
        }
    }

    async function joinGroup(id) {
        await ClerkAuth.fetch(`/api/community/groups/${id}/join`, { method: 'POST' });
        loadGroups();
    }

    async function leaveGroup(id) {
        await ClerkAuth.fetch(`/api/community/groups/${id}/leave`, { method: 'POST' });
        loadGroups();
    }

    // ---- Events ----
    async function loadEvents() {
        const list = document.getElementById('events-list');
        try {
            const res = await ClerkAuth.fetch('/api/community/events');
            const events = res.ok ? await res.json() : [];
            if (!events.length) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><h2 class="empty-title">No upcoming events</h2></div>';
                return;
            }
            list.innerHTML = events.map(buildEventCard).join('');
        } catch (e) {
            list.innerHTML = '<p class="empty-text">Could not load events.</p>';
        }
    }

    function buildEventCard(e) {
        return `
            <div class="app-card" style="margin-bottom: 16px;">
                <div class="app-card-header">
                    <div class="app-card-title">${escapeHtml(e.title)}</div>
                    <span class="badge">${new Date(e.startsAt).toLocaleString()}</span>
                </div>
                <div class="app-card-meta">${e.location ? escapeHtml(e.location) : ''}</div>
                <p class="app-card-body">${escapeHtml(e.description || '')}</p>
            </div>
        `;
    }

    async function createEvent() {
        const title = document.getElementById('evt-title').value.trim();
        const startsAt = document.getElementById('evt-startsAt').value;
        if (!title || !startsAt) { alert('Title and start time are required'); return; }
        const body = {
            title: title,
            startsAt: new Date(startsAt).toISOString(),
            location: document.getElementById('evt-location').value.trim(),
            description: document.getElementById('evt-description').value.trim()
        };
        const res = await ClerkAuth.fetch('/api/community/events', { method: 'POST', body: JSON.stringify(body) });
        if (res.ok) {
            document.getElementById('evt-title').value = '';
            document.getElementById('evt-startsAt').value = '';
            document.getElementById('evt-location').value = '';
            document.getElementById('evt-description').value = '';
            loadEvents();
        }
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
